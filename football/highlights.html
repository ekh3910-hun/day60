<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공식 하이라이트</title><style>body{background:#06171b;color:#e5f4ef;font:16px/1.6 system-ui;margin:0;padding:30px}main{max-width:1100px;margin:auto}a{color:#56e8b7}#list{display:grid;grid-template-columns:1fr 1fr;gap:24px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}small{color:#9ab7ae}@media(max-width:700px){#list{grid-template-columns:1fr}}</style><main><a href="/">← Football 홈</a><h1>Premier League 공식 하이라이트</h1><small>공식 YouTube 영상 재생 · 지역 및 영상별 퍼가기 제한이 적용될 수 있습니다. 더빙은 별도의 사용 가능한 영상 파일로 진행합니다.</small><p><a href="https://www.youtube.com/@premierleague/search?query=highlights" target="_blank" rel="noopener">공식 채널에서 전체 보기 ↗</a></p><p id="status">최근 영상 목록을 불러오는 중…</p><div id="list"></div></main><script>(async()=>{try{const r=await fetch('/api/highlights');const d=await r.json();if(!r.ok)throw Error(d.detail);for(const v of d.videos){const c=document.createElement('article'),h=document.createElement('h3'),f=document.createElement('iframe');h.textContent=v.title;f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id);f.title=v.title;f.loading='lazy';f.allowFullscreen=true;f.allow='encrypted-media; picture-in-picture';c.append(h,f);document.querySelector('#list').append(c)}document.querySelector('#status').textContent=d.videos.length?'':'목록이 비어 있습니다. 공식 채널 링크를 이용하세요.'}catch(e){document.querySelector('#status').textContent=e.message}})();</script></html>
